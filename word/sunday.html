    <script>
        // ★ 새로운 공유 링크 적용 ★
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSktCsHualM1ZIembjwk7eQHv2qep4iFZKvuSmdtRqSTuTFc0CbR2nYiNaaYFCcD9I_XLTkOn6R8By4/pub?gid=705133327&single=true&output=csv";

        let originalData = []; // ★ 검색을 위해 원본 데이터를 따로 보관합니다.
        let formattedData = [];
        const itemsPerPage = 15; 
        let currentPage = 1;

        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let col, c;
            for (let row = col = c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }

        async function loadData() {
            try {
                const response = await fetch(csvUrl);
                const csvText = await response.text();
                
                const rows = parseCSV(csvText);
                rows.shift(); 

                formattedData = rows.map(row => {
                    let rawLink = (row[5] || '').trim();
                    return {
                        id: parseInt(row[0] || 0),
                        title: (row[1] || '').trim(),
                        text: (row[2] || '').trim(),
                        preacher: (row[3] || '').trim(),
                        date: (row[4] || '').trim(),
                        link: rawLink.length > 5 ? rawLink : '#'
                    };
                }).filter(item => item.title !== '' && !isNaN(item.id)); 

                formattedData.sort((a, b) => b.id - a.id);
                originalData = [...formattedData]; // ★ 원본 데이터 복사 저장
                
                renderTable(currentPage);
            } catch (error) {
                console.error("데이터 로딩 에러:", error);
                document.getElementById('sermon-list-pc').innerHTML = '<tr><td colspan="6" class="py-10 text-center text-red-500">데이터를 불러올 수 없습니다.</td></tr>';
            }
        }

        function renderTable(page) {
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = formattedData.slice(startIndex, endIndex);

            const pcTbody = document.getElementById('sermon-list-pc');
            const mobileContainer = document.getElementById('sermon-list-mobile-body');

            pcTbody.innerHTML = '';
            mobileContainer.innerHTML = '';

            // ★ 검색 결과가 없을 때의 화면 처리
            if (pageData.length === 0) {
                pcTbody.innerHTML = '<tr><td colspan="6" class="py-10 text-center text-gray-500 font-bold">검색된 예배 영상이 없습니다.</td></tr>';
                mobileContainer.innerHTML = '<div class="py-10 text-center text-gray-500 font-bold">검색된 예배 영상이 없습니다.</div>';
                renderPagination();
                return;
            }

            pageData.forEach(item => {
                let tag = "";
                let mainTitle = item.title;
                const tagMatch = item.title.match(/^\[(.*?)\]/);
                if (tagMatch) { tag = tagMatch[1]; mainTitle = item.title.replace(/^\[.*?\]\s*/, ''); }

                let preacherPc = item.preacher;
                if (item.preacher.includes('(')) {
                    let namePart = item.preacher.substring(0, item.preacher.indexOf('(')).trim();
                    let churchPart = item.preacher.substring(item.preacher.indexOf('(')).trim();
                    preacherPc = `${namePart}<br><span class="text-[12px] text-gray-500 font-normal mt-0.5 inline-block tracking-tight">${churchPart}</span>`;
                }

                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-200 hover:bg-gray-50 transition cursor-pointer group h-[60px]';
                tr.onclick = (e) => { if(!e.target.closest('a') && !e.target.closest('button')) { if(item.link !== '#') window.open(item.link, '_blank'); } };

                tr.innerHTML = `
                    <td class="py-3 text-gray-400 font-medium">${item.id}</td>
                    <td class="py-3 px-4 text-left">
                        ${tagMatch ? `<span class="text-[#3b82f6] font-bold text-[13px] block mb-0.5">[${tag}]</span>` : ''}
                        <span class="font-bold text-gray-800 text-[15px] group-hover:text-blue-600 transition truncate block max-w-full">${mainTitle}</span>
                    </td>
                    <td class="py-3 text-[13px] md:text-sm text-gray-600 truncate">${item.text}</td>
                    <td class="py-3 text-gray-800 font-medium text-[13px] md:text-sm leading-tight">${preacherPc}</td>
                    <td class="py-3 text-[13px] md:text-sm text-gray-500">${item.date}</td>
                    <td class="py-3">
                        ${item.link !== '#' ? `<a href="${item.link}" target="_blank" class="bg-[#5c5c5c] hover:bg-[#1b315b] text-white rounded w-8 h-6 flex items-center justify-center mx-auto transition"><i class="fas fa-tv text-xs"></i></a>` : `<button class="bg-[#e5e7eb] text-gray-400 cursor-not-allowed rounded w-8 h-6 flex items-center justify-center mx-auto"><i class="fas fa-tv text-xs"></i></button>`}
                    </td>
                `;
                pcTbody.appendChild(tr);

                const mDiv = document.createElement('div');
                mDiv.className = 'flex border-b border-gray-200 py-3 hover:bg-gray-50 transition cursor-pointer items-center px-2';
                mDiv.onclick = () => { if(item.link !== '#') window.open(item.link, '_blank'); };
                mDiv.innerHTML = `
                    <div class="w-12 text-center text-gray-400 text-sm shrink-0 font-medium">${item.id}</div>
                    <div class="flex-1 pl-2 pr-8 relative overflow-hidden">
                        ${tagMatch ? `<div class="text-[#3b82f6] font-bold text-[11px] mb-0.5 truncate">[${tag}]</div>` : ''}
                        <div class="text-gray-900 text-[14px] font-bold mb-1 truncate leading-snug">${mainTitle}</div>
                        <div class="text-gray-500 text-[12px] flex flex-wrap gap-x-2 gap-y-0.5 mb-0.5 leading-tight">
                            <span class="truncate max-w-full">${item.text}</span>
                            <span class="text-gray-700 font-medium">${item.preacher}</span>
                        </div>
                        <div class="text-gray-400 text-[11px]">${item.date}</div>
                        ${item.link !== '#' ? `<div class="absolute top-1/2 right-1 -translate-y-1/2 text-gray-400"><i class="fas fa-tv text-lg"></i></div>` : `<div class="absolute top-1/2 right-1 -translate-y-1/2 text-gray-200"><i class="fas fa-tv text-lg"></i></div>`}
                    </div>
                `;
                mobileContainer.appendChild(mDiv);
            });
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(formattedData.length / itemsPerPage);
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';
            if (totalPages === 0) return;
            const pagesPerGroup = 10;
            const currentGroup = Math.ceil(currentPage / pagesPerGroup);
            let startPage = (currentGroup - 1) * pagesPerGroup + 1;
            let endPage = startPage + pagesPerGroup - 1;
            if (endPage > totalPages) endPage = totalPages;

            const prevGroupBtn = document.createElement('a');
            prevGroupBtn.href = '#';
            prevGroupBtn.className = `page-link rounded ${startPage === 1 ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}`;
            prevGroupBtn.innerHTML = '<i class="fas fa-angle-double-left text-[10px]"></i>';
            prevGroupBtn.onclick = (e) => { e.preventDefault(); currentPage = startPage - 1; renderTable(currentPage); window.scrollTo({top: 400, behavior: 'smooth'}); };
            paginationContainer.appendChild(prevGroupBtn);

            const prevBtn = document.createElement('a');
            prevBtn.href = '#';
            prevBtn.className = `page-link rounded ${currentPage === 1 ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}`;
            prevBtn.innerHTML = '<i class="fas fa-chevron-left text-[10px]"></i>';
            prevBtn.onclick = (e) => { e.preventDefault(); currentPage--; renderTable(currentPage); window.scrollTo({top: 400, behavior: 'smooth'}); };
            paginationContainer.appendChild(prevBtn);

            for (let i = startPage; i <= endPage; i++) {
                const a = document.createElement('a');
                a.href = '#';
                a.className = `page-link ${i === currentPage ? 'active' : ''} rounded`;
                a.textContent = i;
                a.onclick = (e) => { e.preventDefault(); currentPage = i; renderTable(currentPage); window.scrollTo({top: 400, behavior: 'smooth'}); };
                paginationContainer.appendChild(a);
            }

            const nextBtn = document.createElement('a');
            nextBtn.href = '#';
            nextBtn.className = `page-link rounded ${currentPage === totalPages ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}`;
            nextBtn.innerHTML = '<i class="fas fa-chevron-right text-[10px]"></i>';
            nextBtn.onclick = (e) => { e.preventDefault(); currentPage++; renderTable(currentPage); window.scrollTo({top: 400, behavior: 'smooth'}); };
            paginationContainer.appendChild(nextBtn);

            const nextGroupBtn = document.createElement('a');
            nextGroupBtn.href = '#';
            nextGroupBtn.className = `page-link rounded ${endPage === totalPages ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}`;
            nextGroupBtn.innerHTML = '<i class="fas fa-angle-double-right text-[10px]"></i>';
            nextGroupBtn.onclick = (e) => { e.preventDefault(); currentPage = endPage + 1; renderTable(currentPage); window.scrollTo({top: 400, behavior: 'smooth'}); };
            paginationContainer.appendChild(nextGroupBtn);
        }

        // ★ 검색 실행 함수 추가 ★
        function executeSearch() {
            const type = document.getElementById('search-type').value;
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();

            if (!keyword) {
                // 검색어가 비어있으면 원본 데이터로 되돌림
                formattedData = [...originalData]; 
            } else {
                // 검색어가 있으면 필터링 진행
                formattedData = originalData.filter(item => {
                    if (type === 'title') return item.title.toLowerCase().includes(keyword);
                    if (type === 'preacher') return item.preacher.toLowerCase().includes(keyword);
                    if (type === 'text') return item.text.toLowerCase().includes(keyword);
                    return false;
                });
            }
            
            currentPage = 1; // 검색 후에는 항상 1페이지로 이동
            renderTable(currentPage);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            
            // ★ 검색 버튼 클릭 및 엔터키 이벤트 연결 ★
            document.getElementById('search-btn').addEventListener('click', executeSearch);
            document.getElementById('search-keyword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    executeSearch();
                }
            });
        });
    </script>
