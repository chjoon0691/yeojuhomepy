        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #ffffff; overflow-x: hidden; }

        /* 페이지네이션 및 스크롤바 스타일 */
        .page-link {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border: 1px solid #e5e7eb; color: #4b5563;
            font-size: 14px; transition: all 0.2s; margin: 0 2px;
        }
        .page-link:hover { background-color: #f3f4f6; color: #1b315b; }
        .page-link.active { border-color: #1b315b; color: #1b315b; font-weight: bold; }

        /* 모달 세로 스크롤바 디자인 */
        .modal-scroll::-webkit-scrollbar { width: 8px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        /* 확대 이미지 닫기 줌 아웃 커서 */

    <!-- Main Content Layout -->

        <!-- Left Sidebar -->

        <!-- Right Content Area -->

            <div class="w-full bg-[#1b315b] rounded-xl h-24 md:h-32 flex flex-col justify-center items-center text-white shadow-md relative overflow-hidden mb-8">

    <!-- ★ 다중 사진 팝업 모달창 ★ -->
    <div id="edu-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 sm:p-6">

        <div class="relative w-full max-w-4xl bg-white shadow-2xl z-10 flex flex-col max-h-[90vh] rounded-xl overflow-hidden border-t-[6px] border-[#3b82f6]">
            <!-- 모달 헤더 -->
            <div class="bg-white text-gray-800 px-6 py-5 border-b border-gray-200 flex justify-between items-start shrink-0">
                <div class="pr-6">
                    <h2 id="modal-title" class="text-xl md:text-2xl font-extrabold tracking-tight mb-1">제목</h2>
                    <p id="modal-date" class="text-sm text-gray-500 font-medium"><i class="far fa-calendar-alt mr-1"></i> 등록일 : </p>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition-colors focus:outline-none p-2">
                        <i class="fas fa-times text-3xl"></i>
                    </button>
                </div>
            </div>

            <!-- 모달 콘텐츠 -->
            <div class="p-6 md:p-8 overflow-y-auto flex-1 bg-gray-100 modal-scroll flex flex-col items-center gap-6 relative" id="modal-image-container">
                <!-- 로딩 중 메시지 -->
                <div id="loading-msg" class="text-gray-500 font-bold py-10 flex flex-col items-center gap-3">
                    <i class="fas fa-spinner fa-spin text-3xl text-blue-500"></i>
                    <span>사진을 불러오는 중입니다...</span>
                </div>
                <!-- JS로 여러 장의 사진이 삽입됩니다 -->
            </div>
        </div>
    </div>

    <!-- ★ 이미지 전체화면 확대 모달창 ★ -->
    <div id="zoom-modal" class="fixed inset-0 z-[110] hidden items-center justify-center bg-black/90 backdrop-blur-md" onclick="closeZoom()">
        <!-- 닫기 버튼 -->
        <button class="absolute top-6 right-6 text-white/70 hover:text-white transition focus:outline-none z-[120]" onclick="closeZoom()">
            <i class="fas fa-times text-4xl"></i>
        </button>
        <!-- 확대 이미지 영역 -->
        <div class="w-full h-full flex items-center justify-center p-2 sm:p-10 overflow-auto modal-scroll zoom-active">
            <img id="zoom-image" src="" alt="확대된 사진" class="max-w-full max-h-none md:max-h-full object-contain shadow-2xl">
        </div>
    </div>

    <!-- 마법의 파일 연결 2: 공통 하단 푸터 & 사이트맵 -->
    <div id="common-footer"></div>
    <div id="common-sitemap"></div>

    <script>
        // 숫자를 01, 02 형식의 두 자리 문자열로 만들어주는 함수
        function generateBaseNames(start, end) {
            let names = [];
            for (let i = start; i <= end; i++) {
                let numStr = i < 10 ? '0' + i : i.toString();
                names.push(`교육관${numStr}`);
            }
            return names;
        }

        // ★ 교육관 건축 33장의 사진을 4개의 그룹(앨범)으로 묶은 데이터 ★
        const eduData = [
            {
                id: 4,
                title: '교육관건축사진들01',
                date: '2019.09.28',
                fileNames: generateBaseNames(26, 33)
            },
            {
                id: 3,
                title: '교육관건축사진들02',
                date: '2019.06.15',
                fileNames: generateBaseNames(17, 25)
            },
            {
                id: 2,
                title: '교육관건축사진들03',
                date: '2019.04.10',
                fileNames: generateBaseNames(9, 16)
            },
            {
                id: 1,
                title: '교육관건축사진들04',
                date: '2019.03.19',
                fileNames: generateBaseNames(1, 8)
            }
        ];

        // 깃허브 사진 저장소 주소
        const baseURL = "https://raw.githubusercontent.com/chjoon0691/yeojuhomepy/main/welcome/history/images/";
        const itemsPerPage = 12;
        let currentPage = 1;

        // 확장자 자동 탐색하여 썸네일(앨범의 첫 번째 사진) 로딩
        function loadThumbnail(imgElement, baseName) {
            const exts = ['jpg', 'png', 'jpeg', 'JPG', 'PNG'];
            let extIndex = 0;

            function tryNext() {
                if (extIndex >= exts.length) {
                    imgElement.src = `https://placehold.co/800x600/f3f4f6/9ca3af?text=No+Image`;
                    return;
                }
                imgElement.src = `${baseURL}${baseName}.${exts[extIndex]}`;
                extIndex++;
            }

            imgElement.onerror = tryNext;
            tryNext();
        }

        function renderGrid(page) {
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = eduData.slice(startIndex, endIndex);

            const gridContainer = document.getElementById('edu-grid');
            gridContainer.innerHTML = '';

            pageData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'flex flex-col cursor-pointer group';
                card.onclick = () => openModal(item.id);

                let imgId = `thumb-edu-${item.id}`;
                // 썸네일은 각 앨범의 첫 번째 사진의 기본 이름
                let thumbBaseName = item.fileNames[0];

                card.innerHTML = `
                    <div class="w-full aspect-[4/3] rounded-lg overflow-hidden shadow-sm border border-gray-200 mb-2 relative bg-gray-50">
                        <img id="${imgId}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition duration-300"></div>

                        <!-- 마우스 호버 시 왼쪽 위에 나타나는 제목 -->
                        <div class="absolute top-2 left-2 bg-[#1b315b]/90 text-white text-xs font-bold px-2 py-1.5 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-sm z-10 shadow text-left max-w-[90%] leading-snug">
                            ${item.title}
                        </div>

                        <!-- 하단 갤러리 아이콘 및 사진 장수 -->
                        <div class="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded flex items-center gap-1">
                            <i class="far fa-images"></i> ${item.fileNames.length}장
                        </div>
                    </div>
                    <p class="text-sm font-bold text-gray-800 text-center truncate px-1 group-hover:text-[#3b82f6] transition">${item.title}</p>
                    <p class="text-[11px] text-gray-500 text-center mt-0.5">${item.date}</p>
                `;
                gridContainer.appendChild(card);

                // 썸네일 로딩 시도
                loadThumbnail(document.getElementById(imgId), thumbBaseName);
            });

            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(eduData.length / itemsPerPage);
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const a = document.createElement('a');
                a.href = '#';
                a.className = `page-link ${i === currentPage ? 'active' : ''} rounded`;
                a.textContent = i;
                a.onclick = (e) => {
                    e.preventDefault();
                    currentPage = i;
                    renderGrid(currentPage);
                    window.scrollTo({top: 300, behavior: 'smooth'});
                };
                paginationContainer.appendChild(a);
            }
        }

        // ★ 모달(팝업)에서 여러 장의 이미지를 불러오는 함수 ★
        function openModal(id) {
            const data = eduData.find(n => n.id === id);
            if(!data) return;

            document.getElementById('modal-title').textContent = data.title;
            document.getElementById('modal-date').innerHTML = `<i class="far fa-calendar-alt mr-1"></i> 등록일 : ${data.date}`;

            const container = document.getElementById('modal-image-container');

            Array.from(container.children).forEach(child => {
                if(child.id !== 'loading-msg') child.remove();
            });
            document.getElementById('loading-msg').style.display = 'flex';
            document.getElementById('loading-msg').innerHTML = '<i class="fas fa-spinner fa-spin text-3xl text-blue-500"></i><span>사진을 불러오는 중입니다...</span>';

            let loadedCount = 0;

            // 이미지를 하나씩 확장자별로 시도하여 불러오는 재귀 함수
            function tryLoadModalImage(baseName, extsArray, wrapElement) {
                if (extsArray.length === 0) {
                    wrapElement.remove(); // 확장자 못 찾으면 껍데기 삭제
                    return;
                }

                const currentExt = extsArray.shift();
                let imgUrl = `${baseURL}${baseName}.${currentExt}`;

                let imgInnerWrap = document.createElement('div');
                imgInnerWrap.className = 'relative inline-block w-full';

                let img = document.createElement('img');
                img.className = "w-full h-auto object-contain rounded cursor-pointer hover:opacity-90 transition duration-300";
                img.title = "클릭하시면 원본 크기로 확대됩니다.";
                img.onclick = () => openZoom(imgUrl);

                let zoomIcon = document.createElement('div');
                zoomIcon.className = "absolute top-4 right-4 bg-black/50 text-white p-2 rounded-full pointer-events-none opacity-70";
                zoomIcon.innerHTML = '<i class="fas fa-search-plus"></i>';

                imgInnerWrap.appendChild(img);
                imgInnerWrap.appendChild(zoomIcon);
                wrapElement.appendChild(imgInnerWrap);

                img.onload = function() {
                    wrapElement.classList.remove('hidden');
                    document.getElementById('loading-msg').style.display = 'none';
                    loadedCount++;
                };

                img.onerror = function() {
                    // 에러 발생 시 안의 요소를 비우고 다음 확장자로 재시도
                    wrapElement.innerHTML = '';
                    tryLoadModalImage(baseName, extsArray, wrapElement);
                };

                img.src = imgUrl;
            }

            // 앨범에 속한 파일 이름 배열을 돌면서 이미지 틀을 만들고 로딩 시작
            data.fileNames.forEach(baseName => {
                let imgWrap = document.createElement('div');
                imgWrap.className = "bg-white p-2 md:p-3 rounded-lg shadow-sm border border-gray-200 w-full mb-4 hidden flex flex-col";
                container.appendChild(imgWrap);

                // jpg, png 등 여러 확장자 시도 가능성 부여
                tryLoadModalImage(baseName, ['jpg', 'png', 'jpeg', 'JPG', 'PNG'], imgWrap);
            });

            // 빈 앨범일 경우 예외 처리
            if (data.fileNames.length === 0) {
                document.getElementById('loading-msg').innerHTML = '<i class="fas fa-exclamation-circle text-2xl text-gray-400"></i><span>등록된 사진이 없습니다.</span>';
            }

            const modal = document.getElementById('edu-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('edu-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }

        // 확대 모달창 관련 함수
        function openZoom(src) {
            const zoomModal = document.getElementById('zoom-modal');
            const zoomImg = document.getElementById('zoom-image');
            zoomImg.src = src;
            zoomModal.classList.remove('hidden');
            zoomModal.classList.add('flex');
        }

        function closeZoom() {
            const zoomModal = document.getElementById('zoom-modal');
            zoomModal.classList.add('hidden');
            zoomModal.classList.remove('flex');
        }

        // 모바일 보조 메뉴 토글
        function toggleMobileSubMenu(menuId) {
            const targetMenu = document.getElementById(menuId);
            const otherMenuId = menuId === 'menu-depth1' ? 'menu-depth2' : 'menu-depth1';
            const otherMenu = document.getElementById(otherMenuId);
            if (otherMenu && !otherMenu.classList.contains('hidden')) {
                otherMenu.classList.add('hidden');
                const otherIcon = otherMenu.previousElementSibling.querySelector('.fas');
                if(otherIcon) {
                    otherIcon.classList.remove('fa-minus');
                    otherIcon.classList.add('fa-plus');
                }
            }
            if (targetMenu) {
                targetMenu.classList.toggle('hidden');
                const icon = targetMenu.previousElementSibling.querySelector('.fas');
                if(icon) {
                    if(targetMenu.classList.contains('hidden')) {
                        icon.classList.remove('fa-minus');
                        icon.classList.add('fa-plus');
                    } else {
                        icon.classList.remove('fa-plus');
                        icon.classList.add('fa-minus');
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderGrid(currentPage);
        });
    </script>

    <!-- ★ 중요: 서브페이지는 js 파일을 불러오기 위해 경로를 알려줘야 합니다 ★ -->
    <script>const ROOT_PATH = "../../";</script>
