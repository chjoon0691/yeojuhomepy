        const itemsPerPage = 15; 
        let currentPage = 1;

        // 깃허브 사진 보관함 기본 주소 (이 폴더 안에 01-01.jpg, 02-01.png 등을 올리시면 됩니다)
        const baseURL = "https://raw.githubusercontent.com/chjoon0691/yeojuhomepy/main/community/images/";

        function renderTable(page) {
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = companyData.slice(startIndex, endIndex);

            const pcTbody = document.getElementById('company-list-pc');
            const mobileContainer = document.getElementById('company-list-mobile-body');

            pcTbody.innerHTML = '';
            mobileContainer.innerHTML = '';

            pageData.forEach(item => {
                // PC 버전
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-200 hover:bg-gray-50 transition cursor-pointer group';
                tr.onclick = () => openModal(item.id);
                tr.innerHTML = `
                    <td class="py-4 text-gray-400">${item.id}</td>
                    <td class="py-4 text-gray-500 text-sm truncate">${item.category}</td>
                    <td class="py-4 px-4 text-left font-bold text-gray-800 group-hover:text-blue-600 transition flex items-center gap-2">
                        <span class="truncate">${item.name}</span>
                        <i class="far fa-image text-gray-400 text-xs"></i>
                    </td>
                    <td class="py-4 text-sm font-medium text-gray-700">${item.owner}</td>
                `;
                pcTbody.appendChild(tr);

                // 모바일 버전
                const mDiv = document.createElement('div');
                mDiv.className = 'flex border-b border-gray-200 py-3.5 hover:bg-gray-50 transition cursor-pointer items-center';
                mDiv.onclick = () => openModal(item.id);
                mDiv.innerHTML = `

                    <div class="flex-1 pl-2 pr-4 relative">

                        </div>
                        <div class="text-blue-600 text-[13px] font-medium">${item.owner}</div>
                    </div>
                `;
                mobileContainer.appendChild(mDiv);
            });
            
            renderPagination();
        }

        // 페이지네이션 
        function renderPagination() {
            const totalPages = Math.ceil(companyData.length / itemsPerPage);
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const a = document.createElement('a');
                a.href = '#';
                a.className = `page-link ${i === currentPage ? 'active' : ''} rounded`;
                a.textContent = i;
                a.onclick = (e) => {
                    e.preventDefault();
                    currentPage = i;
                    renderTable(currentPage);
                    window.scrollTo({top: 300, behavior: 'smooth'}); 
                };
                paginationContainer.appendChild(a);
            }
        }

        // ★ 모달 열기 및 다중 사진 로딩 시스템 ★
        function openModal(id) {
            const company = companyData.find(c => c.id === id);
            if(!company) return;

            // 텍스트 정보 채우기
            document.getElementById('modal-header-title').textContent = `[${company.category}] ${company.name}`;
            document.getElementById('modal-name').textContent = company.description ? `${company.name} (${company.description})` : company.name;
            document.getElementById('modal-location').textContent = company.location;
            document.getElementById('modal-phone').textContent = company.phone;
            document.getElementById('modal-owner').textContent = company.owner;
            
            // 사진 초기화 및 로딩 시작
            const imageWrapper = document.getElementById('modal-images');
            imageWrapper.innerHTML = `
                <div id="loading-msg" class="text-gray-500 font-bold py-10 flex flex-col items-center gap-3">
                    <i class="fas fa-spinner fa-spin text-3xl text-blue-500"></i>
                    <span>사진을 불러오는 중입니다...</span>
                </div>
            `;
            const loadingMsg = document.getElementById('loading-msg');

            const maxImages = 10; // 기업당 최대 10장까지 검사 (01-01 ~ 01-10)
            let loadedCount = 0;
            let errorCount = 0;

            function tryLoadImage(index, extsArray, wrapElement) {
                if (extsArray.length === 0) {
                    wrapElement.remove();
                    errorCount++;
                    if (loadedCount === 0 && errorCount === maxImages) {
                        loadingMsg.innerHTML = '<i class="fas fa-exclamation-circle text-2xl text-gray-400"></i><span class="mt-2">등록된 사진이 없습니다.</span>';
                    }
                    return;
                }

                const currentExt = extsArray.shift();
                let formattedId = id < 10 ? '0' + id : id;
                let numStr = index < 10 ? '0' + index : index;
                let imgUrl = `${baseURL}${formattedId}-${numStr}.${currentExt}`;

                let imgInnerWrap = document.createElement('div');
                imgInnerWrap.className = 'relative inline-block w-full';

                let img = document.createElement('img');
                img.className = "w-full h-auto object-contain rounded shadow-sm border border-gray-200 cursor-pointer hover:opacity-90 transition duration-300";
                img.title = "클릭하시면 원본 크기로 확대됩니다.";
                img.onclick = () => openZoom(imgUrl);

                let zoomIcon = document.createElement('div');
                zoomIcon.className = "absolute top-4 right-4 bg-black/50 text-white p-2 rounded-full pointer-events-none opacity-70";
                zoomIcon.innerHTML = '<i class="fas fa-search-plus"></i>';
                
                imgInnerWrap.appendChild(img);
                imgInnerWrap.appendChild(zoomIcon);

                img.onload = function() {
                    wrapElement.classList.remove('hidden');
                    loadingMsg.style.display = 'none';
                    loadedCount++;
                    wrapElement.appendChild(imgInnerWrap);
                };

                img.onerror = function() {
                    tryLoadImage(index, extsArray, wrapElement);
                };

                img.src = imgUrl;
            }

            for(let i=1; i<=maxImages; i++) {
                let imgWrap = document.createElement('div');
                imgWrap.className = "bg-white p-2 md:p-3 rounded-lg shadow-sm border border-gray-200 w-full mb-4 hidden flex flex-col";
                imageWrapper.appendChild(imgWrap);

                tryLoadImage(i, ['jpg', 'png', 'jpeg', 'JPG', 'PNG'], imgWrap);
            }

            // 모달 열기
            const modal = document.getElementById('company-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('company-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }

        // 확대 모달창 함수
        function openZoom(src) {
            const zoomModal = document.getElementById('zoom-modal');
            const zoomImg = document.getElementById('zoom-image');
            zoomImg.src = src;
            zoomModal.classList.remove('hidden');
            zoomModal.classList.add('flex');
        }

        function closeZoom() {
            const zoomModal = document.getElementById('zoom-modal');
            zoomModal.classList.add('hidden');
            zoomModal.classList.remove('flex');
        }

        function toggleMobileSubMenu(menuId) {
            const targetMenu = document.getElementById(menuId);
            if (targetMenu) targetMenu.classList.toggle('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTable(currentPage);
        });
    </script>
    <script>const ROOT_PATH = "../";</script>
    <script src="../js/common.js"></script>
</body>
</html>
