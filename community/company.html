108|생산, 제작, 가공, 유통, 축산|아로마플라워|꽃,화분,꽃배달|송미자 권사|여주시 세종로 206(하남돼지집 근처)|010-3885-3368
109|어린이집, 유치원, 학원, 교육|세종어린이집||남기철,이금화 집사|여주시 세종로475번길 26(여주광현교회 근처)|010-7288-2000
110|음식점, 분식, 제과, 커피숍, 식품판매|CUP&CUP||이현석, 김민진 집사|여주시 가남읍 태평로 24-1 가남초등학교 옆|010-9658-1040
        `;

        // 데이터를 자바스크립트 배열로 변환 및 ★최신순(내림차순) 정렬 적용★
        const originalCompanyData = rawCompanyText.trim().split('\n').map(line => {
            const parts = line.split('|');
            return {
                id: parseInt(parts[0] ? parts[0].trim() : 0),
                category: parts[1] ? parts[1].trim() : "",
                name: parts[2] ? parts[2].trim() : "",
                description: parts[3] ? parts[3].trim() : "",
                owner: parts[4] ? parts[4].trim() : "",
                location: parts[5] ? parts[5].trim() : "",
                phone: parts[6] ? parts[6].trim() : ""
            };
        }).filter(item => !isNaN(item.id)).sort((a, b) => b.id - a.id); 

        // 검색 필터링을 위한 복사본 생성
        let companyData = [...originalCompanyData];

        const itemsPerPage = 15; 
        let currentPage = 1;

        // 깃허브 사진 보관함 기본 주소 
        const baseURL = "https://raw.githubusercontent.com/chjoon0691/yeojuhomepy/main/community/images/";

        // ★ 변경된 부분: 썸네일을 '상호명'으로 똑똑하게 확인하고 jfif 확장자를 포함하는 함수 ★
        function loadThumbnailIcon(id, name) {
            const exts = ['jpg', 'png', 'jpeg', 'JPG', 'PNG', 'jfif', 'JFIF'];
            const patterns = ['', '-01']; // 1장짜리 이름(상호명.jpg)과 다중 이름(상호명-01.jpg) 모두 순차적으로 검사
            let extIndex = 0;
            let patternIndex = 0;

            let dummyImg = new Image();
            function tryNext() {
                if (patternIndex >= patterns.length) return; // 모든 경우의 수 실패하면 아이콘 안 띄움
                
                dummyImg.src = `${baseURL}${name}${patterns[patternIndex]}.${exts[extIndex]}`;
                
                extIndex++;
                if (extIndex >= exts.length) {
                    extIndex = 0;
                    patternIndex++;
                }
            }
            
            dummyImg.onload = function() {
                // 성공하면 사진 아이콘을 보여줌
                const iconPc = document.getElementById(`icon-pc-${id}`);
                const iconM = document.getElementById(`icon-m-${id}`);
                if (iconPc) iconPc.classList.remove('hidden');
                if (iconM) iconM.classList.remove('hidden');
            };
            dummyImg.onerror = tryNext;
            
            tryNext();
        }

        // ★ 테이블/리스트 화면에 그리기 ★
        function renderTable(page) {
            document.getElementById('total-count').textContent = companyData.length;

            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = companyData.slice(startIndex, endIndex);

            const pcTbody = document.getElementById('company-list-pc');
            const mobileContainer = document.getElementById('company-list-mobile-body');

            pcTbody.innerHTML = '';
            mobileContainer.innerHTML = '';

            if(pageData.length === 0) {
                pcTbody.innerHTML = '<tr><td colspan="4" class="py-10 text-center text-gray-500 font-bold">검색된 성도기업이 없습니다.</td></tr>';
                mobileContainer.innerHTML = '<div class="py-10 text-center text-gray-500 font-bold">검색된 성도기업이 없습니다.</div>';
                renderPagination();
                return;
            }

            pageData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-200 hover:bg-gray-50 transition cursor-pointer group h-[50px]';
                tr.onclick = () => openModal(item.id);
                tr.innerHTML = `
                    <td class="py-3 text-gray-400 font-medium">${item.id}</td>
                    <td class="py-3 text-gray-500 text-sm truncate px-2">${item.category}</td>
                    <td class="py-3 px-4 text-left font-bold text-gray-800 group-hover:text-blue-600 transition flex items-center gap-2">
                        <span class="truncate">${item.name}</span>
                        <i id="icon-pc-${item.id}" class="far fa-image text-gray-400 text-sm hidden"></i>
                    </td>
                    <td class="py-3 text-[14px] font-medium text-gray-700 truncate px-2">${item.owner}</td>
                `;
                pcTbody.appendChild(tr);

                const mDiv = document.createElement('div');
                mDiv.className = 'flex border-b border-gray-200 py-3 hover:bg-gray-50 transition cursor-pointer items-center px-2';
                mDiv.onclick = () => openModal(item.id);
                mDiv.innerHTML = `
                    <div class="w-12 text-center text-gray-400 text-sm shrink-0 font-medium">${item.id}</div>
                    <div class="flex-1 pl-2 pr-4 relative overflow-hidden">
                        <div class="text-gray-500 text-[11px] mb-0.5 truncate">${item.category}</div>
                        <div class="text-gray-800 text-[15px] font-bold mb-0.5 flex items-center gap-1.5">
                            <span class="truncate max-w-[90%]">${item.name}</span>
                            <i id="icon-m-${item.id}" class="far fa-image text-gray-400 text-[11px] hidden shrink-0 mt-0.5"></i>
                        </div>
                        <div class="text-blue-700 text-[12px] font-medium truncate">${item.owner}</div>
                    </div>
                `;
                mobileContainer.appendChild(mDiv);

                // 리스트 렌더링 시 사진이 있는지 살짝 체크
                loadThumbnailIcon(item.id, item.name);
            });
            renderPagination();
        }

        // ★ 페이지네이션 (10개씩 묶음, 화살표 추가) ★
        function renderPagination() {
            const totalPages = Math.ceil(companyData.length / itemsPerPage);
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';
            
            if (totalPages === 0) return;
            
            const pagesPerGroup = 10;
            const currentGroup = Math.ceil(currentPage / pagesPerGroup);
            let startPage = (currentGroup - 1) * pagesPerGroup + 1;
            let endPage = startPage + pagesPerGroup - 1;
            
            if (endPage > totalPages) endPage = totalPages;

            // [이전 10페이지] 버튼 (<<)
            const prevGroupBtn = document.createElement('a');
            prevGroupBtn.href = '#';
            prevGroupBtn.className = `page-link rounded ${startPage === 1 ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}`;
            prevGroupBtn.innerHTML = '<i class="fas fa-angle-double-left text-[10px]"></i>';
            prevGroupBtn.onclick = (e) => {
                e.preventDefault();
                if (startPage > 1) {
                    currentPage = startPage - 1;
                    renderTable(currentPage);
                    window.scrollTo({top: 300, behavior: 'smooth'}); 
                }
            };
            paginationContainer.appendChild(prevGroupBtn);

            // [이전 1페이지] 화살표 버튼 (<)
            const prevBtn = document.createElement('a');
            prevBtn.href = '#';
            prevBtn.className = `page-link rounded ${currentPage === 1 ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}`;
            prevBtn.innerHTML = '<i class="fas fa-chevron-left text-[10px]"></i>';
            prevBtn.onclick = (e) => {
                e.preventDefault();
                if (currentPage > 1) {
                    currentPage--;
                    renderTable(currentPage);
                    window.scrollTo({top: 300, behavior: 'smooth'}); 
                }
            };
            paginationContainer.appendChild(prevBtn);

            // [페이지 번호] 버튼
            for (let i = startPage; i <= endPage; i++) {
                const a = document.createElement('a');
                a.href = '#';
                a.className = `page-link ${i === currentPage ? 'active' : ''} rounded`;
                a.textContent = i;
                a.onclick = (e) => {
                    e.preventDefault();
                    currentPage = i;
                    renderTable(currentPage);
                    window.scrollTo({top: 300, behavior: 'smooth'}); 
                };
                paginationContainer.appendChild(a);
            }

            // [다음 1페이지] 화살표 버튼 (>)
            const nextBtn = document.createElement('a');
            nextBtn.href = '#';
            nextBtn.className = `page-link rounded ${currentPage === totalPages ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}`;
            nextBtn.innerHTML = '<i class="fas fa-chevron-right text-[10px]"></i>';
            nextBtn.onclick = (e) => {
                e.preventDefault();
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTable(currentPage);
                    window.scrollTo({top: 300, behavior: 'smooth'}); 
                }
            };
            paginationContainer.appendChild(nextBtn);

            // [다음 10페이지] 버튼 (>>)
            const nextGroupBtn = document.createElement('a');
            nextGroupBtn.href = '#';
            nextGroupBtn.className = `page-link rounded ${endPage === totalPages ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}`;
            nextGroupBtn.innerHTML = '<i class="fas fa-angle-double-right text-[10px]"></i>';
            nextGroupBtn.onclick = (e) => {
                e.preventDefault();
                if (endPage < totalPages) {
                    currentPage = endPage + 1;
                    renderTable(currentPage);
                    window.scrollTo({top: 300, behavior: 'smooth'}); 
                }
            };
            paginationContainer.appendChild(nextGroupBtn);
        }

        // ★ 검색 기능 실행 함수 ★
        function executeSearch() {
            const type = document.getElementById('search-type').value;
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();

            if (!keyword) {
                // 검색어가 없으면 원래 전체 데이터로 복구
                companyData = [...originalCompanyData];
            } else {
                // 검색어가 있으면 필터링
                companyData = originalCompanyData.filter(item => {
                    if (type === 'name') {
                        return item.name.toLowerCase().includes(keyword) || item.description.toLowerCase().includes(keyword);
                    } else if (type === 'category') {
                        return item.category.toLowerCase().includes(keyword);
                    } else if (type === 'owner') {
                        return item.owner.toLowerCase().includes(keyword);
                    }
                    return false;
                });
            }
            
            currentPage = 1; // 검색 후 무조건 1페이지로 이동
            renderTable(currentPage);
        }

        // ★ 모달(팝업창) 다중 사진 불러오기 로직 ★
        function openModal(id) {
            // 원본 데이터에서 찾기
            const company = originalCompanyData.find(c => c.id === id);
            if(!company) return;
            
            // 텍스트 정보 세팅
            document.getElementById('modal-header-title').textContent = `[${company.category}] ${company.name}`;
            
            const fullName = company.description ? `${company.name} <span class="text-sm text-gray-500 font-normal ml-1">${company.description}</span>` : company.name;
            document.getElementById('modal-name').innerHTML = fullName;
            
            document.getElementById('modal-location').textContent = company.location || "-";
            document.getElementById('modal-phone').textContent = company.phone || "-";
            document.getElementById('modal-owner').textContent = company.owner || "-";
            
            // 사진 컨테이너 초기화
            const container = document.getElementById('modal-image-container');
            Array.from(container.children).forEach(child => {
                if(child.id !== 'loading-msg') child.remove();
            });
            
            const loadingMsg = document.getElementById('loading-msg');
            loadingMsg.style.display = 'flex';
            loadingMsg.innerHTML = '<i class="fas fa-spinner fa-spin text-2xl text-blue-500"></i><span>사진을 불러오는 중입니다...</span>';

            const maxImages = 10; // 하나의 성도기업에 최대 10장까지 등록 가능하다고 가정
            let loadedCount = 0;
            let errorCount = 0;

            // ★ 변경된 부분: jfif를 포함하여 사진 한 장일 때와 여러 장일 때를 모두 감지하는 로직 ★
            function tryLoadModalImage(index, wrapElement) {
                const exts = ['jpg', 'png', 'jpeg', 'JPG', 'PNG', 'jfif', 'JFIF'];
                let currentExtIndex = 0;
                let tryCountForIndex1 = 0; // 첫 번째 사진일 때: 0이면 '상호명.jpg', 1이면 '상호명-01.jpg' 검사

                function loadStep() {
                    // 지정된 확장자를 다 찾아봤는데 없을 경우
                    if (currentExtIndex >= exts.length) {
                        if (index === 1 && tryCountForIndex1 === 0) {
                            // 단일 이름(상호명.jpg)을 못 찾았으면, 다중 이름(상호명-01.jpg)으로 2차 시도!
                            tryCountForIndex1 = 1;
                            currentExtIndex = 0;
                            loadStep();
                        } else {
                            // 완전히 실패했을 경우 (사진 없음 처리)
                            wrapElement.remove(); 
                            errorCount++;
                            if(loadedCount === 0 && errorCount === maxImages) {
                                loadingMsg.innerHTML = '<i class="fas fa-exclamation-circle text-xl text-gray-400"></i><span class="mt-1">등록된 사진이 없습니다.</span>';
                            }
                        }
                        return; // 반복 방지를 위해 멈춤
                    }

                    let imgUrl = "";
                    if (index === 1 && tryCountForIndex1 === 0) {
                        // 1번 사진은 먼저 꼬리표 없는 '상호명.jpg' 형식 확인
                        imgUrl = `${baseURL}${company.name}.${exts[currentExtIndex]}`;
                    } else {
                        // 2번 사진 이상이거나, 1번 사진 2차 시도일 경우 '상호명-01.jpg' 형식 확인
                        let numStr = index < 10 ? '0' + index : index;
                        imgUrl = `${baseURL}${company.name}-${numStr}.${exts[currentExtIndex]}`;
                    }

                    let img = new Image();
                    
                    img.onload = function() {
                        // 로딩 성공 시 화면에 예쁘게 추가
                        img.className = "w-full h-auto object-contain rounded shadow-sm border border-gray-200 cursor-pointer hover:opacity-90 transition duration-300 bg-white";
                        img.title = "클릭하시면 원본 크기로 확대됩니다.";
                        img.onclick = () => openZoom(imgUrl);
                        
                        let imgInnerWrap = document.createElement('div');
                        imgInnerWrap.className = 'relative inline-block w-full';
                        
                        let zoomIcon = document.createElement('div');
                        zoomIcon.className = "absolute top-4 right-4 bg-black/50 text-white p-2 rounded-full pointer-events-none opacity-70";
                        zoomIcon.innerHTML = '<i class="fas fa-search-plus"></i>';
                        
                        imgInnerWrap.appendChild(img);
                        imgInnerWrap.appendChild(zoomIcon);

                        wrapElement.classList.remove('hidden'); 
                        loadingMsg.style.display = 'none'; 
                        loadedCount++;
                        wrapElement.appendChild(imgInnerWrap);
                    };
                    
                    img.onerror = function() {
                        // 실패 시 다음 확장자(png, jpeg, jfif 등)로 재검색
                        currentExtIndex++;
                        loadStep();
                    };
                    
                    img.src = imgUrl; 
                }
                
                loadStep();
            }

            for(let i = 1; i <= maxImages; i++) {
                let imgWrap = document.createElement('div');
                imgWrap.className = "w-full mb-3 hidden"; 
                container.appendChild(imgWrap);
                tryLoadModalImage(i, imgWrap);
            }

            // 모달 열기
            const modal = document.getElementById('company-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('company-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }

        // 전체화면 확대 기능
        function openZoom(src) {
            const zoomModal = document.getElementById('zoom-modal');
            const zoomImg = document.getElementById('zoom-image');
            zoomImg.src = src;
            zoomModal.classList.remove('hidden');
            zoomModal.classList.add('flex');
        }

        function closeZoom() {
            const zoomModal = document.getElementById('zoom-modal');
            zoomModal.classList.add('hidden');
            zoomModal.classList.remove('flex');
        }

        // 모바일 보조메뉴 토글
        function toggleMobileSubMenu(menuId) {
            const targetMenu = document.getElementById(menuId);
            const otherMenuId = menuId === 'menu-depth1' ? 'menu-depth2' : 'menu-depth1';
            const otherMenu = document.getElementById(otherMenuId);
            
            if (otherMenu && !otherMenu.classList.contains('hidden')) {
                otherMenu.classList.add('hidden');
                const otherIcon = otherMenu.previousElementSibling.querySelector('.fas');
                if(otherIcon) {
                    otherIcon.classList.remove('fa-minus');
                    otherIcon.classList.add('fa-plus');
                }
            }
            if (targetMenu) {
                targetMenu.classList.toggle('hidden');
                const icon = targetMenu.previousElementSibling.querySelector('.fas');
                if(icon) {
                    if(targetMenu.classList.contains('hidden')) {
                        icon.classList.remove('fa-minus');
                        icon.classList.add('fa-plus');
                    } else {
                        icon.classList.remove('fa-plus');
                        icon.classList.add('fa-minus');
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 초기 렌더링
            renderTable(currentPage);

            // 검색 버튼 클릭 이벤트
            document.getElementById('search-btn').addEventListener('click', executeSearch);

            // 검색창 엔터키 입력 이벤트
            document.getElementById('search-keyword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    executeSearch();
                }
            });
        });
    </script>
